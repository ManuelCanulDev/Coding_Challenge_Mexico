services:
  balam-xchange:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Sustituye por tu dominio Coolify (https://...)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      DEMO_MODE: ${DEMO_MODE:-true}
      SETTINGS_DB_PATH: /app/backend/data/settings.sqlite
      STRICT_LIVE: ${STRICT_LIVE:-true}
      FX_USDT_USD_RATE: ${FX_USDT_USD_RATE:-1}
    volumes:
      - balam-data:/app/backend/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  balam-xchange-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    environment:
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173

volumes:
  balam-data:
